services:
  proxy:
    build:
      context: .
      dockerfile: deploy/Caddy.Dockerfile
    image: kekbot-caddy:2.11.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      KEKBOT_DOMAIN: ${KEKBOT_DOMAIN:?Set KEKBOT_DOMAIN to your public hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
