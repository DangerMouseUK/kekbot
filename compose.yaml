services:
  kekbot:
    build:
      context: .
      args:
        VCS_REF: ${KEKBOT_SOURCE_REF:-unknown}
    image: kekbot:0.1.0-beta.2
    init: true
    restart: unless-stopped
    env_file: ${KEKBOT_ENV_FILE:-.env.local}
    environment:
      KEKBOT_DATA_DIR: /data
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${KEKBOT_HOST_DATA_DIR:-./data}:/data
    stop_grace_period: 30s
