name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak:
        description: Run the one-hour synthetic fixture soak (no live providers)
        type: boolean
        default: false
      package:
        description: Upload only audited candidate source/image/notices, launcher, metadata and checksums
        type: boolean
        default: false
      dependencies:
        description: Review locked application/tooling and exported image vulnerabilities (read-only; advisories fail this review)
        type: boolean
        default: false
      published_release:
        description: Optional explicit published tag to rehearse through real release discovery and both installer formats
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}-${{ inputs.soak && 'soak' || inputs.dependencies && 'dependencies' || 'checks' }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks/archive.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks"
      - name: Scan complete Git history with redacted output
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --log-opts="--all" .'
      - name: Scan candidate files with redacted output
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --no-banner .'
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      KEKBOT_RUN_JOBS: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Validate downloadable Bash launcher syntax
        run: bash -n install.sh
      - run: pnpm exec drizzle-kit check
      - run: pnpm dependencies:audit
      - run: pnpm build
      - run: pnpm test:standalone
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      KEKBOT_RUN_JOBS: "0"
      KEKBOT_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Use the official HTTPS Ubuntu package mirror
        # The runner's Azure HTTP mirror can stall apt before tests start.
        run: printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 8
      - run: pnpm test:e2e
      # Traces, screenshots, databases and generated credentials stay on the
      # ephemeral runner. Never upload them as public workflow artifacts.
      - if: matrix.browser == 'chromium'
        run: pnpm test:workload
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      KEKBOT_RUN_JOBS: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment examples using empty example credentials
        run: |
          cp .env.example .env.local
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.proxy.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.ip.yaml config --quiet
          KEKBOT_ENV_FILE="$PWD/.env.local" KEKBOT_HOST_DATA_DIR="$RUNNER_TEMP/kekbot-data" docker compose --env-file .env.example -f compose.yaml -f compose.ip.yaml config --quiet
        env:
          KEKBOT_DOMAIN: kekbot.example
          KEKBOT_PUBLIC_IP: 203.0.113.10
      - name: Validate handbook Compose overrides without starting services
        run: node scripts/check-doc-compose.mjs
      - name: Build the retained installer Caddy context and check domain/IP configurations
        run: python3 -B installer/smoke.py --proxy-context
      - run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t kekbot:ci .
      - run: pnpm test:container
      - name: Install checksum-pinned Gitleaks for image application layers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks/archive.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks"
      - name: Audit every image application layer and prepare candidate archives
        run: pnpm release:prepare --image kekbot:ci --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks"
      - name: Verify candidate archive checksums
        run: for directory in output/release/*; do (cd "$directory" && sha256sum --check SHA256SUMS); done
      - name: Load the exported image and install into a fresh isolated volume
        run: node scripts/release-roundtrip.mjs
      - name: Rehearse guided install, update recovery and uninstall with isolated fixtures
        run: sudo python3 -B installer/smoke.py
      - name: Rehearse the explicit published release without live providers
        if: github.event_name == 'workflow_dispatch' && inputs.published_release != ''
        env:
          KEKBOT_RELEASE_TAG: ${{ inputs.published_release }}
        run: sudo --preserve-env=KEKBOT_RELEASE_TAG python3 -B installer/smoke.py --release "$KEKBOT_RELEASE_TAG"
      - name: Review frozen dependency inputs without updating versions
        if: github.event_name == 'workflow_dispatch' && inputs.dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          curl --fail --location --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz --output "$RUNNER_TEMP/trivy/archive.tar.gz"
          printf '%s  %s\n' 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f' "$RUNNER_TEMP/trivy/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy/archive.tar.gz" -C "$RUNNER_TEMP/trivy"
          docker save --output "$RUNNER_TEMP/trivy/candidate.tar" kekbot:ci
          review_status=0
          pnpm dependencies:review --scanner "$RUNNER_TEMP/trivy/trivy" --image-archive "$RUNNER_TEMP/trivy/candidate.tar" --image-findings || review_status=1
          docker save --output "$RUNNER_TEMP/trivy/proxy.tar" kekbot-caddy:2.11.6
          mkdir -p "$RUNNER_TEMP/proxy-review"
          curl --fail --location --retry 3 https://go.dev/dl/go1.27.2.linux-amd64.tar.gz --output "$RUNNER_TEMP/proxy-review/go.tar.gz"
          printf '%s  %s\n' 'ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5' "$RUNNER_TEMP/proxy-review/go.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/proxy-review/go.tar.gz" -C "$RUNNER_TEMP/proxy-review"
          export GOTOOLCHAIN=local GOBIN="$RUNNER_TEMP/proxy-review/bin" GOCACHE="$RUNNER_TEMP/proxy-review/cache" GOMODCACHE="$RUNNER_TEMP/proxy-review/modules"
          "$RUNNER_TEMP/proxy-review/go/bin/go" install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          node scripts/proxy-review.mjs --scanner "$RUNNER_TEMP/trivy/trivy" --archive "$RUNNER_TEMP/trivy/proxy.tar" --go "$RUNNER_TEMP/proxy-review/go/bin/go" --govulncheck "$GOBIN/govulncheck" || review_status=1
          exit "$review_status"
        # Only counts and bounded allowlisted advisory metadata are printed. No automatic updates,
        # waivers, evidence writes, runtime uploads or release publication. The exact
        # uncompiled OpenPGP module match requires image-bound binary/symbol proof.
      - name: Upload audited candidate archives only
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kekbot-candidate-${{ github.sha }}
          path: output/release/*/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  soak:
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      KEKBOT_RUN_JOBS: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Use the official HTTPS Ubuntu package mirror
        run: printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 8
      - name: One-hour sustained load, one-minute burst, five browser clients, restart
        run: pnpm benchmark
      - name: Publish only the aggregate fixture summary
        if: always()
        run: node scripts/workload-summary.mjs
