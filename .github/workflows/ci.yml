name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks/archive.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks"
      - name: Scan complete Git history with redacted output
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --log-opts="--all" .'
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      KEKBOT_RUN_JOBS: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec drizzle-kit check
      - run: pnpm audit --prod
      - run: pnpm build
      - run: pnpm test:standalone
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Validate deployment examples using empty example credentials
        run: |
          cp .env.example .env.local
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.proxy.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.ip.yaml config --quiet
          KEKBOT_ENV_FILE="$PWD/.env.local" KEKBOT_HOST_DATA_DIR="$RUNNER_TEMP/kekbot-data" docker compose --env-file .env.example -f compose.yaml -f compose.ip.yaml config --quiet
        env:
          KEKBOT_DOMAIN: kekbot.example
          KEKBOT_PUBLIC_IP: 203.0.113.10
      - name: Check pinned Caddy configurations without issuing certificates
        run: |
          docker build --file deploy/Caddy.Dockerfile --tag kekbot-caddy:2.11.6 .
          docker run --rm --env KEKBOT_DOMAIN=kekbot.example --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" kekbot-caddy:2.11.6 caddy adapt --config /etc/caddy/Caddyfile > /dev/null
          docker run --rm --env KEKBOT_PUBLIC_IP=203.0.113.10 --volume "$PWD/deploy/Caddyfile.ip:/etc/caddy/Caddyfile:ro" kekbot-caddy:2.11.6 caddy adapt --config /etc/caddy/Caddyfile > /dev/null
      - run: docker build -t kekbot:ci .
      - run: pnpm test:container
